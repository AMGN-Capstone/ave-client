<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Longform Auto Editor</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Longform Auto Editor MVP</p>
        <h1>정보성 영상 수집 및 업로드</h1>
      </div>
      <span class="status-pill" id="apiStatus">API 대기 중</span>
    </header>

    <main class="workspace">
      <section class="tool-panel primary-panel" aria-labelledby="youtubeTitle">
        <div class="section-heading">
          <span class="step-index">01</span>
          <div>
            <h2 id="youtubeTitle">YouTube URL</h2>
            <p>원본 영상, 자막, 메타데이터를 프로젝트 자료로 수집합니다.</p>
          </div>
        </div>

        <form id="youtubeForm" class="stacked-form">
          <label for="youtubeUrl">영상 링크</label>
          <div class="inline-control">
            <input
              id="youtubeUrl"
              name="url"
              type="url"
              placeholder="https://www.youtube.com/watch?v=..."
              autocomplete="off"
              required
            >
            <button type="submit">수집 시작</button>
          </div>
        </form>

        <div class="result-box" id="youtubeResult" aria-live="polite">
          <span class="muted">수집 결과가 여기에 표시됩니다.</span>
        </div>
      </section>

      <section class="tool-panel" aria-labelledby="uploadTitle">
        <div class="section-heading">
          <span class="step-index">02</span>
          <div>
            <h2 id="uploadTitle">직접 영상 업로드</h2>
            <p>로컬 영상도 같은 편집 파이프라인의 입력으로 저장합니다.</p>
          </div>
        </div>

        <form id="uploadForm" class="stacked-form">
          <label for="videoFile">영상 파일</label>
          <input id="videoFile" name="file" type="file" accept=".mp4,.mov,.mkv,.webm,video/*" required>
          <button type="submit" class="secondary-button">업로드</button>
        </form>

        <div class="result-box" id="uploadResult" aria-live="polite">
          <span class="muted">업로드 결과가 여기에 표시됩니다.</span>
        </div>
      </section>
    </main>

    <section class="pipeline">
      <h2>초기 파이프라인</h2>
      <ol>
        <li>영상과 스크립트 수집</li>
        <li>자막 기반 주요 구간 분석</li>
        <li>ffmpeg 편집 작업 생성</li>
        <li>롱폼 결과 영상 저장</li>
      </ol>
    </section>

    <script src="/static/script.js"></script>
  </body>
</html>
