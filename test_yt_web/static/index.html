<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Longform Auto Editor</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Longform Auto Editor</p>
        <h1>YouTube 영상·스크립트 수집</h1>
      </div>
      <div class="account-area">
        <span class="status-pill" id="apiStatus">Supabase 연결 확인 중</span>
        <button id="googleLoginButton" type="button">Google로 로그인</button>
        <button id="logoutButton" type="button" hidden>로그아웃</button>
      </div>
    </header>

    <main class="workspace">
      <section class="tool-panel primary-panel" aria-labelledby="youtubeTitle">
        <div class="section-heading">
          <span class="step-index">01</span>
          <div>
            <h2 id="youtubeTitle">YouTube URL 수집</h2>
            <p>로그인한 사용자의 영상·자막·메타데이터를 Supabase에 저장합니다.</p>
          </div>
        </div>

        <form id="youtubeForm" class="stacked-form">
          <label for="youtubeUrl">영상 링크</label>
          <div class="inline-control">
            <input id="youtubeUrl" name="url" type="url"
              placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" required>
            <button type="submit">수집 시작</button>
          </div>
        </form>

        <div class="result-box" id="youtubeResult" aria-live="polite">
          <span class="muted">수집 결과가 여기에 표시됩니다.</span>
        </div>
      </section>
    </main>

    <section class="pipeline">
      <h2>현재 처리 흐름</h2>
      <ol>
        <li>Google 로그인</li>
        <li>YouTube 링크 수집</li>
        <li>영상·자막·메타데이터 Storage 저장</li>
        <li>사용자별 DB 기록</li>
      </ol>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/static/script.js"></script>
  </body>
</html>
